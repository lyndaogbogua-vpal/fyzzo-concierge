<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 950" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37" />
      <stop offset="50%" stop-color="#C69234" />
      <stop offset="100%" stop-color="#9A6B1F" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E4D3B" />
      <stop offset="100%" stop-color="#063326" />
    </linearGradient>
  </defs>

  <!-- SHIELD EMBLEM -->
  <g transform="translate(250, 40)">
    <!-- Outer Shield Border -->
    <path d="M150 0 C220 0 290 20 300 90 C300 240 210 330 150 370 C90 330 0 240 0 90 C10 20 80 0 150 0 Z" 
          fill="none" stroke="url(#emeraldGrad)" stroke-width="16" stroke-linejoin="round" />
    
    <!-- Inner Shield Infill and Border -->
    <path d="M150 24 C205 24 265 40 274 95 C274 220 200 295 150 334 C100 295 26 220 26 95 C35 40 95 24 150 24 Z" 
          fill="none" stroke="url(#goldGrad)" stroke-width="6" stroke-linejoin="round" />

    <!-- MONOGRAM F and FIDUCIARY KEY (Access and Protection) -->
    <!-- Key Bow / Ring (Head of Key) -->
    <circle cx="150" cy="115" r="34" fill="none" stroke="url(#goldGrad)" stroke-width="12" />
    
    <!-- Key Shaft and Monogram Stem -->
    <rect x="144" y="145" width="12" height="135" fill="url(#goldGrad)" rx="4" />
    
    <!-- Key Bit (Teeth) -->
    <rect x="156" y="240" width="24" height="10" fill="url(#goldGrad)" rx="2" />
    <rect x="156" y="260" width="18" height="10" fill="url(#goldGrad)" rx="2" />

    <!-- Bold Monogram F Bars (Integrated with Key) -->
    <!-- F Stem (Left bar in Emerald) -->
    <path d="M105 100 L135 100 L135 270 L105 270 Z" fill="url(#emeraldGrad)" />
    <!-- F Top Bar -->
    <path d="M105 100 L210 100 C218 100 222 105 220 115 C218 125 210 130 198 130 L135 130 Z" fill="url(#emeraldGrad)" />
    <!-- F Middle Bar -->
    <path d="M105 170 L185 170 C192 170 196 174 195 182 C194 190 188 194 180 194 L135 194 Z" fill="url(#emeraldGrad)" />
  </g>

  <!-- BRAND NAME: FYZZO -->
  <text x="400" y="580" font-family="'Playfair Display', Georgia, serif" font-size="105" font-weight="800" 
        letter-spacing="12" fill="#0A3D2E" text-anchor="middle">FYZZO</text>

  <!-- SECONDARY LINE: CONCIERGE & TRUST SERVICES LTD -->
  <text x="400" y="645" font-family="'Plus Jakarta Sans', Helvetica, Arial, sans-serif" font-size="24" font-weight="700" 
        letter-spacing="8" fill="#C69234" text-anchor="middle">CONCIERGE &amp; TRUST SERVICES LTD</text>

  <!-- SUB-DESCRIPTOR / FIDUCIARY PROMISE -->
  <line x1="220" y1="690" x2="580" y2="690" stroke="#E2E8F0" stroke-width="1.5" />
  <text x="400" y="725" font-family="'Plus Jakarta Sans', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" 
        letter-spacing="5" fill="#64748B" text-anchor="middle">PRIVATE CLIENT FIDUCIARY &amp; ASSET PROTECTION</text>
</svg>